[package]
name = "msgpackr"
version = "0.1.0"
edition = "2021"
description = "MessagePack implementation with record structures and extensions, 100% compatible with msgpackr JS"
license = "MIT"

[features]
default = []
bigint = ["dep:num-bigint"]
chrono = ["dep:chrono"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
num-bigint = { version = "0.4", optional = true }
chrono = { version = "0.4", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
